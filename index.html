<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipnest</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="top">
      <div>
        <h1>Clipnest</h1>
        <p>클릭하면 복사되고, 우클릭하면 크게 볼 수 있습니다.</p>
      </div>
      <p id="count" class="count">0개</p>
    </header>
    <main>
      <p id="empty" class="empty">
        아직 저장된 이미지가 없습니다. 이미지를 복사하면 여기에 나타납니다.
      </p>
      <p id="status" class="status" hidden></p>
      <ul id="gallery" class="gallery"></ul>
    </main>
    <dialog id="viewer" class="viewer">
      <img id="viewer-image" alt="" />
      <button type="button" id="viewer-close" class="viewer-close">닫기</button>
    </dialog>
  </body>
</html>
